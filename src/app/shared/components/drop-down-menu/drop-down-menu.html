<!-- ========================= -->
<!-- BOTÓN MOBILE -->
<!-- ========================= -->

<button type="button" class="btn btn-primary w-full sm:hidden" popovertarget="filters-mobile-menu">
  <!-- Icono filtro -->
  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="h-5 w-5"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="2"
  >
    <path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M6 12h12M10 18h4" />
  </svg>

  Filtros
</button>

<!-- ========================= -->
<!-- MENÚ MOBILE -->
<!-- ========================= -->

<div
  id="filters-mobile-menu"
  popover
  class="m-0 w-[calc(100vw-2rem)] max-w-sm rounded-2xl border border-base-300 bg-base-100 p-0 shadow-2xl"
>
  <!-- Header -->
  <div class="flex items-center justify-between border-b border-base-300 px-4 py-4">
    <div>
      <h3 class="font-bold">Filtros</h3>

      <p class="text-xs text-base-content/50">Selecciona una opción</p>
    </div>

    <!-- Cerrar -->
    <button
      type="button"
      class="btn btn-sm btn-circle btn-ghost"
      popovertarget="filters-mobile-menu"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Contenido -->
  <div class="max-h-[65vh] overflow-y-auto p-4">
    <div class="flex flex-col gap-4">
      @for (menu of dropDownMenus(); track $index) {
        <!-- Grupo de filtro -->
        <div class="rounded-xl border border-base-300 bg-base-200/30 p-3">
          <!-- Título -->
          <div class="mb-3 flex items-center gap-2">
            <div
              class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-primary/10 text-primary"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M6 12h12M10 18h4" />
              </svg>
            </div>

            <span class="text-sm font-semibold">
              {{ menu.menuTitle }}
            </span>
          </div>

          <!-- Opciones -->
          <div class="grid grid-cols-2 gap-2">
            @for (item of menu.menuItems; track $index) {
              <button
                type="button"
                class="btn btn-sm h-auto min-h-9 justify-start border border-base-300 bg-base-100 px-3 py-2 text-left text-xs font-medium transition-all duration-200 hover:border-primary hover:bg-primary/10 hover:text-primary active:scale-95"
                (click)="optionSelected(menu.menuTitle, item)"
              >
                {{ item | wordCapitalized }}
              </button>
            }
          </div>
        </div>
      }
    </div>
  </div>
</div>

<!-- ========================= -->
<!-- MENÚ DESKTOP -->
<!-- ========================= -->

<div class="hidden w-full items-center gap-2 sm:flex">
  @for (menu of dropDownMenus(); track $index; let i = $index) {
    <div class="dropdown dropdown-end">
      <!-- Botón -->
      <button tabindex="0" type="button" class="btn btn-outline gap-2">
        {{ menu.menuTitle }}

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />
        </svg>
      </button>

      <!-- Opciones -->
      <ul
        tabindex="0"
        class="dropdown-content menu z-50 mt-2 w-52 rounded-xl border border-base-300 bg-base-100 p-2 shadow-xl"
      >
        @for (item of menu.menuItems; track $index) {
          <li>
            <button
              type="button"
              class="rounded-lg text-sm hover:bg-primary/10 hover:text-primary"
              (click)="optionSelected(menu.menuTitle, item)"
            >
              {{ item | wordCapitalized }}
            </button>
          </li>
        }
      </ul>
    </div>
  }
</div>
