<div
  class="group flex h-full w-full max-w-sm flex-col overflow-hidden rounded-2xl border border-base-200 bg-base-100 shadow-sm transition-all duration-300 hover:shadow-xl"
>
  <!-- Imagen -->
  <div class="shrink-0 overflow-hidden bg-base-200/30">
    <carousel-images [productImages]="productImages()" />
  </div>

  <!-- Información -->
  <div class="flex flex-1 flex-col p-5">
    <!-- Marca -->
    <div class="flex shrink-0 items-center justify-between">
      <span class="text-xs font-semibold uppercase tracking-widest text-base-content/40">
        {{ brandProduct() | titlecase }}
      </span>

      <span class="rounded-full bg-primary/10 px-2.5 py-1 text-xs font-semibold text-primary">
        Disponible
      </span>
    </div>

    <!-- Nombre -->
    <h2 class="mt-3 min-h-7 text-xl font-bold">
      {{ cardTitle() }}
    </h2>

    <!-- Descripción -->
    <p class="mt-2 min-h-12 line-clamp-2 text-sm leading-6 text-base-content/60">
      {{ cardDescription() }}
    </p>

    <!-- Precio -->
    <div class="mt-auto flex items-center justify-between rounded-xl bg-base-200/50 px-4 py-3">
      <span class="text-sm font-medium text-base-content/50"> Precio </span>

      <div class="flex items-baseline gap-1">
        <span class="text-sm font-semibold text-base-content/50"> L. </span>

        <span class="text-2xl font-extrabold text-primary">
          {{ priceProduct() | number: '1.0-3' }}
        </span>
      </div>
    </div>
  </div>
</div>
