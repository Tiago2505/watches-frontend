<div class="flex items-center gap-3">

  <select
    class="
      select
      select-bordered
      w-56
      rounded-xl
      bg-base-100
      shadow-sm
      transition
      duration-200
      hover:border-primary
      focus:border-primary
      focus:outline-none
      focus:ring-2
      focus:ring-primary/20
    "
  >

  @for(option of options(); track $index){
    <option (click)="shareOption(option)" [selected]="option === 'Watches'">
      {{option}}
    </option>
  }
  </select>

</div>
