<div class="drawer drawer-end">
  <input id="profile-drawer" type="checkbox" class="drawer-toggle" />

  <!-- Contenido -->
  <div class="drawer-content">
    <!-- Botón abrir -->
    <label
      for="profile-drawer"
      class="btn btn-ghost btn-circle bg-base-200 transition hover:bg-primary/10 hover:text-primary"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-7 w-7"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 12a4 4 0 100-8 4 4 0 000 8z" />

        <path stroke-linecap="round" stroke-linejoin="round" d="M4 20c0-4 3.582-7 8-7s8 3 8 7" />
      </svg>
    </label>
  </div>

  <!-- Drawer -->
  <div class="drawer-side z-50">
    <label for="profile-drawer" class="drawer-overlay"></label>

    <aside class="flex min-h-full w-full max-w-sm flex-col bg-base-100 shadow-2xl">
      <!-- Header -->
      <div class="flex items-center justify-between border-b border-base-300 px-6 py-5">
        <div>
          <h2 class="text-xl font-bold">Mi perfil</h2>

          <p class="text-sm text-base-content/60">Cuenta y seguridad</p>
        </div>

        <label for="profile-drawer" class="btn btn-ghost btn-circle">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </label>
      </div>

      <div class="flex flex-1 flex-col gap-5 overflow-y-auto p-6">
        <!-- Profile -->
        <div class="flex flex-col items-center">
          <div
            class="flex h-20 w-20 items-center justify-center rounded-full bg-base-200 text-primary ring-4 ring-primary/10"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-10 w-10"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5.121 17.804A13.937 13.937 0 0112 15c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
          </div>

          <h3 class="mt-4 text-lg font-bold">
            {{ userInformation().fullName | titlecase}}
          </h3>

          <p class="text-sm text-base-content/60">
            {{ userInformation().email }}
          </p>
        </div>

        <!-- Role Card -->
        <div class="rounded-2xl border border-base-300 p-4">
          <div class="mb-3 flex items-center justify-between">
            <span class="text-sm font-medium"> Rol actual </span>

            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 text-primary"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15l3.09 1.82-.82-3.68L17 10.5l-3.75-.32L12 6.5l-1.25 3.68L7 10.5l2.73 2.64-.82 3.68L12 15z"
              />
            </svg>
          </div>

          <div class="flex items-center justify-between rounded-xl bg-primary/10 px-4 py-3">
            <span class="font-semibold text-primary">
              {{ userInformation().role | titlecase }}
            </span>

            <span class="flex h-2.5 w-2.5 rounded-full bg-success"></span>
          </div>
        </div>

        <!-- Information -->
        <div class="flex flex-col gap-3">
          <div class="rounded-xl bg-base-200/50 p-4">
            <span class="text-xs text-base-content/50"> Teléfono </span>

            <p class="mt-1 font-medium">+504 {{ userInformation().phone }}</p>
          </div>

          <button
            class="flex items-center justify-between rounded-xl border border-base-300 p-4 transition hover:bg-base-200"

            (click)="navigationService.goToSendPasswordResetCode()"
          >
            <span class="font-medium"> Cambiar contraseña </span>

            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 text-base-content/50"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Logout -->
      <div class="border-t border-base-300 p-6">
        <button class="btn btn-error w-full rounded-xl" (click)="logout()">Cerrar sesión</button>
      </div>
    </aside>
  </div>
</div>
