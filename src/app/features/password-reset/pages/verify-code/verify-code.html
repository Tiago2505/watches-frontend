@if (showMessage()) {
  <div class="top-0 fixed w-full z-10">
    @if (codeVerificationWasSuccessful()) {
      <success-text [successText]="successMessage()" />
    } @else {
      <error-text [errorText]="errorMessage()" />
    }
  </div>
}

@if (verifyCodeRxResource.isLoading() || createNewCodeRxResource.isLoading()) {
  <div class="w-full h-screen flex justify-center items-center">
    <loading-spinner />
  </div>
}

<div class="flex min-h-screen items-center justify-center bg-base-200 px-4 py-6 animation-fadeIn">
  <div class="w-full max-w-md">
    <!-- Card -->
    <div class="rounded-3xl bg-base-100 p-8 shadow-xl sm:p-10">
      <verify-code-header [userEmail]="userEmail()!" />

      <!-- Verification -->
      <form class="mt-7" [formGroup]="verifyCodeGroup">
        <!-- Code Label -->
        <div class="mb-2 flex items-center justify-between">
          <span class="text-sm font-medium"> Código de verificación </span>

          <span class="text-xs text-base-content/50"> 6 dígitos </span>
        </div>

        <!-- Code Input -->
        <div
          class="rounded-2xl border-2 border-base-300 bg-base-200/50 p-1.5 transition focus-within:border-primary focus-within:bg-base-100"
        >
          <input
            type="text"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="000000"
            class="h-12 w-full border-0 bg-transparent text-center text-3xl font-bold tracking-[0.65em] text-base-content outline-none placeholder:text-base-content/20 focus:outline-none"
            formControlName="code"
          />
        </div>

        <verify-code-timer [timeLeft]="timeLeft" />

        <verify-code-button [btnAction]="verify" />
      </form>

      <resend-code-button [btnAction]="resendCode" />

      <go-to-email-button />
    </div>
  </div>
</div>
