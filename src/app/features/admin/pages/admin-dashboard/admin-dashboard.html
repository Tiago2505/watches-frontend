<div class="mx-auto flex max-w-7xl flex-col gap-8 px-6 py-10">

  <div class=" flex justify-between">
    <div>
      <h1 class="text-3xl font-bold">Administración</h1>

      <p class="mt-1 text-base-content/60">Selecciona el módulo que deseas administrar.</p>

    </div>
    <div>
      <user-profile [userInformation]="userInformation()" />
    </div>
  </div>


  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">

    @for (product of products(); track $index) {

      <product-card-admin-dashboard [productCardTitle]="product.title" [buttonAction]="product.buttonAction" [wasSelected]="productCardSelected() === product.title" (productCardSelected)="productCardSelected.set($event)" />

    }

  </div>
</div>

<div class="p-5">
  <router-outlet />
</div>
