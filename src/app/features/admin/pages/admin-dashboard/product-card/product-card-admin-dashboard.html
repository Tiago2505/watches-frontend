<button
  class="group flex flex-col items-start rounded-2xl border border-base-300 bg-base-100 p-6 text-left shadow-sm transition-all duration-300 hover:-translate-y-1 hover:border-primary hover:shadow-xl"
  [class.border-primary]="wasSelected()"
  (click)="productCardSelected.emit(productCardTitle())"
  (click)="buttonAction()()"
>
  <!-- Icono -->
  <div
    class="mb-5 flex h-14 w-14 items-center justify-center rounded-xl bg-primary/10 text-primary transition-transform duration-300 group-hover:scale-110"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-8 w-8"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <circle cx="12" cy="12" r="9"></circle>
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 2"></path>
    </svg>
  </div>

  <h2 class="text-lg font-semibold transition-colors group-hover:text-primary">{{productCardTitle()}}</h2>

  <p class="mt-2 text-sm text-base-content/60">Agrega, edita y elimina los {{productCardTitle() | lowercase}} disponibles.</p>
</button>
